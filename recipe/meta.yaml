{% set name = "mpmath" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mpmath-{{ version }}.tar.gz
  sha256: d272b40c031ba0ee385e7e5fc735b48560d9838a0d7fbca109919efd23580a22

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python
  run_constrained:
    - gmpy2 >=2.3

test:
  imports:
    - mpmath
    - mpmath.calculus
    - mpmath.functions
    - mpmath.libmp
    - mpmath.matrices
    - mpmath.tests
  requires:
    - pip
    - pytest >=6
    - hypothesis
  commands:
    - pip check
    # Whole test scope is too long.
    - pytest --pyargs mpmath.tests.test_basic_ops

about:
  home: https://mpmath.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python library for arbitrary-precision floating-point arithmetic
  description: |
    mpmath is a free Python library for real and complex floating-point
    arithmetic with arbitrary precision.
  doc_url: https://mpmath.org/doc/current
  dev_url: https://github.com/mpmath/mpmath

extra:
  recipe-maintainers:
    - asmeurer
    - msarahan
    - ocefpaf
