{% set version = "1.2.1" %}

package:
  name: mpmath
  version: {{ version }}

source:
  fn: mpmath-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/m/mpmath/mpmath-{{ version }}.tar.gz
  sha256: 79ffb45cf9f4b101a807595bcb3e72e0396202e0b1d25d689134b48c4216a81a

build:
  number: 1
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - setuptools >=36.7.0
    - setuptools_scm >=1.7.0
    - pip
    - wheel
  run:
    - python

test:
  imports:
    - mpmath
    - mpmath.calculus
    - mpmath.functions
    - mpmath.libmp
    - mpmath.matrices
    - mpmath.tests
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://mpmath.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Python library for arbitrary-precision floating-point arithmetic
  description: |
    mpmath is a free Python library for real and complex floating-point
    arithmetic with arbitrary precision.
  doc_url: https://mpmath.org/doc/current/
  dev_url: https://github.com/mpmath/mpmath

extra:
  recipe-maintainers:
    - asmeurer
    - msarahan
    - ocefpaf
